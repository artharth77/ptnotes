appId: com.ptnotes.app
productName: PTNotes
electronLanguages:
  - en-US
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!**/node_modules/**/*.map'
  - '!**/node_modules/**/*.d.ts'
  - '!**/node_modules/**/*.d.mts'
  - '!**/node_modules/lucide-static/font'
  - '!**/node_modules/lucide-static/icons'
  - '!**/node_modules/lucide-static/dist/esm'
  - '!**/node_modules/lucide-static/sprite.svg'
  - '!**/node_modules/lucide-static/icon-nodes.json'
  - '!**/node_modules/mermaid/dist/mermaid.js*'
  - '!**/node_modules/mermaid/dist/mermaid.min.js*'
  - '!**/node_modules/mermaid/dist/mermaid.esm.mjs*'
  - '!**/node_modules/mermaid/dist/mermaid.esm.min.mjs*'
  - '!**/node_modules/mermaid/dist/chunks/mermaid.esm'
  - '!**/node_modules/mermaid/dist/chunks/mermaid.esm.min'
  - '!**/node_modules/pdfjs-dist/build'
  - '!**/node_modules/pdfjs-dist/web'
  - '!**/node_modules/pdfjs-dist/types'
  - '!**/node_modules/pdfjs-dist/node_modules'
  - '!**/node_modules/openai/src'
  - from: node_modules/@antv/layout/lib/node_modules
    to: node_modules/@antv/layout/lib/node_modules
    filter:
      - '**/*'
      - '!**/*.map'
      - '!**/*.d.ts'
asarUnpack:
  - resources/**
  - '**/node_modules/@resvg/**'
  - '**/node_modules/@napi-rs/**'
  - '**/node_modules/svgdom/fonts/**'
win:
  executableName: ptnotes
  target:
    - target: nsis
    - target: portable
portable:
  artifactName: ${name}-${version}-portable.${ext}
  requestExecutionLevel: user
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
