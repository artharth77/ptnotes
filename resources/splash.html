<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>PTNotes</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #131418;
        user-select: none;
        cursor: default;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
          sans-serif;
        color: #e6e8ee;
        -webkit-font-smoothing: antialiased;
      }
      .logo {
        width: 88px;
        height: 88px;
      }
      .title {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .spinner {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2.5px solid rgba(255, 255, 255, 0.14);
        border-top-color: #6b85ff;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <img class="logo" id="logo" alt="" />
    <div class="title">PTNotes</div>
    <div class="spinner"></div>
    <script>
      var icon = new URLSearchParams(location.search).get('icon')
      if (icon) document.getElementById('logo').src = icon
    </script>
  </body>
</html>
